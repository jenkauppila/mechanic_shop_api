swagger: '2.0'
info:
  title: 'Mechanic Shop API'
  description: 'API for a fictitious Mechanic Shop, built entirely from scratch.'
  version: '1.0.0'

host: 'mechanic-shop-api-1-ezx9.onrender.com'
schemes:
  - 'https'
consumes:
  - 'application/json'
produces:
  - 'application/json'

securityDefinitions:
  bearerAuth:
    type: apiKey
    name: Authorization
    in: header

# ------------------------
paths:
  # ------------------------
  # Customer Paths
  # ------------------------
  /customers/login:
    post:
      tags: [Customers]
      summary: Customer Login (generates token)
      description: Validates customer credentials, generates and return a customer-specific token.
      parameters:
        - in: body
          name: body
          description: Login Credentials
          required: true
          schema:
            $ref: '#/definitions/LoginCredentials'
      responses:
        200:
          description: Customer Login Successful; Token returned
          schema:
            $ref: '#/definitions/LoginResponse'
          examples:
            application/json:
              status: success
              message: Login successful
              auth_token: your_jwt_token_here
        401:
          description: Invalid email or password
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Invalid email or password'

  /customers:
    post:
      tags: [Customers]
      summary: Endpoint to create/register a new customer
      description: 'Endpoint to create a new customer in our system, emails must be unique.'
      parameters:
        - in: body
          name: body
          description: Information required to create a new Customer
          required: true
          schema:
            $ref: '#/definitions/CreateCustomerPayload'
      responses:
        201:
          description: Customer created successfully
          schema:
            $ref: '#/definitions/CreateCustomerResponse'
          examples:
            application/json:
              id: 1
              name: John Doe
              email: jonnydoe@example.com
              phone: '123-456-7890'
              password: securepassword
        400:
          description: Validation error or email already exists
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Email already exists'

    get:
      tags: [Customers]
      summary: Returns list of all customers
      description: Endpoint to retrieve a list of all customers. Supports optional pagination; falls back to returning every customer if pagination params are omitted or invalid.
      parameters:
        - in: query
          name: page
          description: Page number to retrieve (defaults to 1)
          type: integer
          required: false
        - in: query
          name: per_page
          description: Number of customers per page (defaults to 5)
          type: integer
          required: false
      responses:
        200:
          description: Successfully retrieved customer list
          schema:
            $ref: '#/definitions/AllCustomers'
          examples:
            application/json:
              - id: 1
                name: John Doe
                email: jonnydoe@example.com
                phone: '123-456-7890'
                password: securepassword

    put:
      tags: [Customers]
      summary: Update customer details (login required)
      description: Endpoint to update a customer; this is a token authenticated route, and the customer must be logged in to update their account. The customer being updated is identified by the token, not a request parameter. Limited to 10 updates per day.
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          description: Information required to update a Customer
          required: true
          schema:
            $ref: '#/definitions/UpdateCustomerPayload'
      responses:
        200:
          description: Successfully Updated Customer
          schema:
            $ref: '#/definitions/UpdateCustomerResponse'
          examples:
            application/json:
              id: 1
              name: John Doe Updated
              email: johnnydoe_updated@example.com
              phone: '123-456-7890'
              password: newpassword123
        401:
          description: Missing, invalid, or expired token
          schema:
            type: object
            properties:
              message:
                type: string
            example:
              message: 'Required token missing'
        404:
          description: Customer not found
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Customer not found'

    delete:
      tags: [Customers]
      summary: Delete Customer (login required)
      description: Endpoint to delete a customer; requires token authentication, customer must be logged in to delete their account. The customer being deleted is identified by the token, not a request parameter. Limited to 5 deletions per day.
      security:
        - bearerAuth: []
      responses:
        200:
          description: Successfully Deleted Customer
          schema:
            $ref: '#/definitions/DeleteCustomerResponse'
          examples:
            application/json:
              message: 'Customer id: 1 deleted successfully'
        401:
          description: Missing, invalid, or expired token
          schema:
            type: object
            properties:
              message:
                type: string
            example:
              message: 'Required token missing'

  # ------------------------
  # Vehicle Paths
  # ------------------------
  /vehicles:
    post:
      tags: [Vehicles]
      summary: Add new vehicle
      description: Endpoint to register a new vehicle in our system, associated with an existing customer. VINs must be unique.
      parameters:
        - in: body
          name: body
          description: Information required to create a new Vehicle
          required: true
          schema:
            $ref: '#/definitions/CreateVehiclePayload'
      responses:
        201:
          description: Vehicle created successfully
          schema:
            $ref: '#/definitions/VehicleResponse'
          examples:
            application/json:
              id: 1
              VIN: '1HGCM82633A123456'
              make: Honda
              model: Accord
              year: 2003
              customer_id: 1
        400:
          description: Validation error or VIN already exists
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Vehicle with this VIN already exists'
        404:
          description: Customer not found
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Customer not found'

    get:
      tags: [Vehicles]
      summary: Returns list of all vehicles
      description: Endpoint to retrieve a list of all vehicles.
      responses:
        200:
          description: Successfully retrieved vehicle list
          schema:
            $ref: '#/definitions/VehicleList'
          examples:
            application/json:
              - id: 1
                VIN: '1HGCM82633A123456'
                make: Honda
                model: Accord
                year: 2003
                customer_id: 1

  /vehicles/{id}:
    get:
      tags: [Vehicles]
      summary: Get vehicle by ID
      description: Retrieve detailed information about a specific vehicle using its unique ID.
      parameters:
        - in: path
          name: id
          description: Vehicle's unique ID
          required: true
          type: integer
      responses:
        200:
          description: Vehicle found
          schema:
            $ref: '#/definitions/VehicleResponse'
          examples:
            application/json:
              id: 1
              VIN: '1HGCM82633A123456'
              make: Honda
              model: Accord
              year: 2003
              customer_id: 1
        404:
          description: Vehicle not found
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Vehicle not found'

    put:
      tags: [Vehicles]
      summary: Update vehicle details
      description: Update details of an existing vehicle using its unique ID.
      parameters:
        - in: path
          name: id
          description: Vehicle's unique ID
          required: true
          type: integer
        - in: body
          name: body
          description: Information required to update a Vehicle
          required: true
          schema:
            $ref: '#/definitions/UpdateVehiclePayload'
      responses:
        200:
          description: Successfully Updated Vehicle
          schema:
            $ref: '#/definitions/VehicleResponse'
          examples:
            application/json:
              id: 1
              VIN: '1HGCM82633A123456'
              make: Honda
              model: Accord
              year: 2004
              customer_id: 1
        400:
          description: Validation error or VIN already exists
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Vehicle with this VIN already exists'
        404:
          description: Vehicle or Customer not found
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Vehicle not found'

    delete:
      tags: [Vehicles]
      summary: Delete Vehicle by ID
      description: Delete a vehicle from the system using its unique ID.
      parameters:
        - in: path
          name: id
          description: Vehicle's unique ID
          required: true
          type: integer
      responses:
        200:
          description: Successfully deleted Vehicle
          schema:
            type: object
            properties:
              message:
                type: string
            example:
              message: 'Vehicle id: 1 deleted successfully'
        404:
          description: Vehicle not found
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Vehicle not found'

  # ------------------------
  # Mechanic Paths
  # ------------------------
  /mechanics:
    post:
      tags: [Mechanics]
      summary: Add new mechanic
      description: Endpoint to create a new mechanic in our system, emails must be unique.
      parameters:
        - in: body
          name: body
          description: Information required to create a new Mechanic
          required: true
          schema:
            $ref: '#/definitions/CreateMechanicPayload'
      responses:
        201:
          description: Mechanic created successfully
          schema:
            $ref: '#/definitions/MechanicResponse'
          examples:
            application/json:
              email: jane.mechanic@example.com
              id: 1
              name: Jane Mechanic
              phone: '123-456-7890'
              salary: 55000.00
        400:
          description: Validation error or email already exists
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Email already exists'

    get:
      tags: [Mechanics]
      summary: Returns list of all mechanics
      description: Endpoint to retrieve a list of all mechanics. Limited to 5 requests per minute.
      responses:
        200:
          description: Retrieved mechanic list successfully
          schema:
            $ref: '#/definitions/MechanicList'
          examples:
            application/json:
              - email: jane.mechanic@example.com
                id: 1
                name: Jane Mechanic
                phone: '123-456-7890'
                salary: 50000.00

  /mechanics/{id}:
    get:
      tags: [Mechanics]
      summary: Get mechanic by ID
      description: Retrieve detailed information about a specific mechanic using their unique ID.
      parameters:
        - in: path
          name: id
          description: Mechanic's unique ID
          required: true
          type: integer
      responses:
        200:
          description: Mechanic found
          schema:
            $ref: '#/definitions/MechanicResponse'
          examples:
            application/json:
              email: jane.mechanic@example.com
              id: 1
              name: Jane Mechanic
              phone: '123-456-7890'
              salary: 50000.00
        404:
          description: Mechanic not found
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Mechanic not found.'

    put:
      tags: [Mechanics]
      summary: Update mechanic details
      description: Update details of an existing mechanic using their unique ID.
      parameters:
        - in: path
          name: id
          description: Mechanic's unique ID
          required: true
          type: integer
        - in: body
          name: body
          description: Information required to update a Mechanic
          required: true
          schema:
            $ref: '#/definitions/UpdateMechanicPayload'
      responses:
        200:
          description: Successfully Updated Mechanic
          schema:
            $ref: '#/definitions/MechanicResponse'
          examples:
            application/json:
              email: jane.mechanic@example.com
              id: 1
              name: Jane Mechanic
              phone: '123-456-7890'
              salary: 50000.00
        400:
          description: Validation error or email already exists
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Email already exists'
        404:
          description: Mechanic not found
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Mechanic not found.'

    delete:
      tags: [Mechanics]
      summary: Delete Mechanic by ID
      description: Delete a mechanic from the system using their unique ID. Limited to 5 deletions per day.
      parameters:
        - in: path
          name: id
          description: Mechanic's unique ID
          required: true
          type: integer
      responses:
        200:
          description: Successfully deleted Mechanic
          schema:
            type: object
            properties:
              message:
                type: string
            example:
              message: 'Mechanic id: 1 deleted successfully.'
        404:
          description: Mechanic not found
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Mechanic not found.'

  /mechanics/search:
    get:
      tags: [Mechanics]
      summary: Search Mechanic by name
      description: Endpoint to search for a mechanic using their name.
      parameters:
        - in: query
          name: name
          description: Full or partial name of mechanic to search for
          type: string
          required: true
      responses:
        200:
          description: Search results
          schema:
            type: array
            items:
              $ref: '#/definitions/MechanicResponse'
          examples:
            application/json:
              - email: jane.mechanic@example.com
                id: 1
                name: Jane Mechanic
                phone: '123-456-7890'
                salary: 50000.00
        404:
          description: No mechanics found with that name
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'No mechanics found with that name.'

  /mechanics/usage:
    get:
      tags: [Mechanics]
      summary: Mechanic usage stats
      description: Returns statistics about mechanic usage, by frequency of service tickets assigned, sorted from most to least tickets.
      responses:
        200:
          description: Mechanic usage stats returned
          schema:
            type: array
            items:
              $ref: '#/definitions/MechanicUsageEntry'
          examples:
            application/json:
              - id: 1
                name: Jane Mechanic
                ticket_count: 5
              - id: 2
                name: John Smith
                ticket_count: 3

  # ------------------------
  # Service Ticket Paths
  # ------------------------
  /service_tickets:
    post:
      tags: [Service Tickets]
      summary: Create service ticket
      description: Endpoint to create a new service ticket for a customer's vehicle.
      parameters:
        - in: body
          name: body
          description: Information required to create a new Service Ticket
          required: true
          schema:
            $ref: '#/definitions/CreateServiceTicketPayload'
      responses:
        201:
          description: Successfully created service ticket
          schema:
            $ref: '#/definitions/ServiceTicketResponse'
          examples:
            application/json:
              id: 4
              vehicle_id: 1
              customer_id: 1
              service_date: '2025-10-01'
              service_desc: 'Oil change and tire rotation'
              mechanics: []
              inventory_items: []
        400:
          description: Validation error
          schema:
            type: object
            properties:
              error:
                type: string
        404:
          description: Customer or Vehicle not found
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Vehicle not found'

    get:
      tags: [Service Tickets]
      summary: Get all service tickets
      description: Endpoint to retrieve a list of all service tickets.
      responses:
        200:
          description: Successfully retrieved Service Ticket list
          schema:
            type: array
            items:
              $ref: '#/definitions/ServiceTicketResponse'
          examples:
            application/json:
              - id: 4
                vehicle_id: 1
                customer_id: 1
                service_date: '2025-10-01'
                service_desc: 'Oil change and tire rotation'
                mechanics: []
                inventory_items: []

  /service_tickets/{id}:
    get:
      tags: [Service Tickets]
      summary: Get Service Ticket by ID
      description: Retrieve detailed information about a specific service ticket using its unique ID.
      parameters:
        - in: path
          name: id
          description: Service Ticket's unique ID
          required: true
          type: integer
      responses:
        200:
          description: Service Ticket details
          schema:
            $ref: '#/definitions/ServiceTicketResponse'
          examples:
            application/json:
              id: 4
              vehicle_id: 1
              customer_id: 1
              service_date: '2025-10-01'
              service_desc: 'Oil change and tire rotation'
              mechanics: []
              inventory_items:
                - id: 1
                  name: Oil Filter
                  price: 19.99
                  quantity: 2
        404:
          description: Service Ticket not found
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Service Ticket not found.'

    delete:
      tags: [Service Tickets]
      summary: Delete Service ticket
      description: Delete service ticket using its unique ID. A ticket cannot be deleted while it still has mechanics or inventory items assigned to it; remove those first via the edit endpoint.
      parameters:
        - in: path
          name: id
          description: Service Ticket's unique ID
          required: true
          type: integer
      responses:
        200:
          description: Successfully deleted Service Ticket
          schema:
            type: object
            properties:
              message:
                type: string
            example:
              message: 'Service Ticket #4 deleted successfully'
        400:
          description: Ticket still has mechanics and/or inventory items assigned
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'mechanic(s) [1] still assigned to ticket'
        404:
          description: Service Ticket not found
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Service Ticket not found'

  /service_tickets/{id}/edit:
    put:
      tags: [Service Tickets]
      summary: Update Service Ticket
      description: Add/Remove Mechanic and Inventory Item details of an existing service ticket using its unique ID. Each item added via add_item_ids may specify a quantity (defaults to 1 if omitted). IDs that fail to apply (not found, already assigned, or not assigned) are skipped and reported in the notes list rather than failing the whole request.
      parameters:
        - in: path
          name: id
          description: Service Ticket's unique ID
          required: true
          type: integer
        - in: body
          name: body
          description: Information required to add/remove Mechanic(s) and Inventory Item(s) from a Service Ticket
          required: true
          schema:
            $ref: '#/definitions/UpdateServiceTicketPayload'
      responses:
        200:
          description: Service Ticket updated successfully
          schema:
            $ref: '#/definitions/UpdateServiceTicketResponse'
          examples:
            application/json:
              message: 'Service Ticket #4 updated successfully'
              service_ticket:
                id: 4
                vehicle_id: 1
                customer_id: 1
                service_date: '2025-10-01'
                service_desc: 'Oil change and tire rotation'
                mechanics:
                  - id: 1
                    name: Jane Mechanic
                inventory_items:
                  - id: 1
                    name: Oil Filter
                    price: 19.99
                    quantity: 2
              notes: []
        400:
          description: Validation error
          schema:
            type: object
            properties:
              error:
                type: string
        404:
          description: Service Ticket not found
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Service Ticket #4 not found in system'

  /service_tickets/my-tickets:
    get:
      tags: [Customers]
      summary: Get all service tickets for the logged-in customer
      description: Returns a list of service tickets that belong to the authenticated customer.
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of customer service tickets
          schema:
            type: array
            items:
              $ref: '#/definitions/ServiceTicketResponse'
        401:
          description: Missing, invalid, or expired token
          schema:
            type: object
            properties:
              message:
                type: string
            example:
              message: 'Required token missing'

  # ------------------------
  # Inventory Paths
  # ------------------------
  /inventory:
    post:
      tags: [Inventory]
      summary: Add inventory item
      description: Endpoint to add a new inventory item/part to the system.
      parameters:
        - in: body
          name: body
          description: Information required to create a new Inventory Item
          required: true
          schema:
            $ref: '#/definitions/CreateInventoryItemPayload'
      responses:
        201:
          description: Successfully added inventory item
          schema:
            $ref: '#/definitions/InventoryItemResponse'
          examples:
            application/json:
              id: 1
              name: Oil Filter
              price: 19.99
        400:
          description: Duplicate item
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Item already exists in Inventory'

    get:
      tags: [Inventory]
      summary: Returns list of all inventory items
      description: Endpoint to retrieve a list of all inventory items. Supports optional pagination; falls back to returning every item if pagination params are omitted or invalid.
      parameters:
        - in: query
          name: page
          description: Page number to retrieve (defaults to 1)
          type: integer
          required: false
        - in: query
          name: per_page
          description: Number of items per page (defaults to 5)
          type: integer
          required: false
      responses:
        200:
          description: Items retrieved
          schema:
            type: array
            items:
              $ref: '#/definitions/InventoryItemResponse'
          examples:
            application/json:
              - id: 1
                name: Oil Filter
                price: 19.99
              - id: 2
                name: Spark Plug
                price: 5.49

  /inventory/{id}:
    get:
      tags: [Inventory]
      summary: Get inventory item by ID
      description: Retrieve detailed information about a specific inventory item using its unique ID.
      parameters:
        - in: path
          name: id
          description: Inventory item's unique ID
          required: true
          type: integer
      responses:
        200:
          description: Item found
          schema:
            $ref: '#/definitions/InventoryItemResponse'
          examples:
            application/json:
              id: 1
              name: Oil Filter
              price: 19.99
        404:
          description: Item not found
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Inventory item not found'

    put:
      tags: [Inventory]
      summary: Update inventory item details
      description: Update an existing inventory item by its unique ID. Limited to 10 updates per day.
      parameters:
        - in: path
          name: id
          description: Inventory item's unique ID
          required: true
          type: integer
        - in: body
          name: body
          description: Information required to update an Inventory Item
          required: true
          schema:
            $ref: '#/definitions/UpdateInventoryItemPayload'
      responses:
        200:
          description: Item details updated
          schema:
            $ref: '#/definitions/InventoryItemResponse'
          examples:
            application/json:
              id: 1
              name: Oil Filter
              price: 21.99
        400:
          description: Duplicate item name
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Item with this name already exists in Inventory'
        404:
          description: Item not found
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Inventory item not found'

    delete:
      tags: [Inventory]
      summary: Delete inventory item by ID
      description: Delete an inventory item using its unique ID. Limited to 5 deletions per day.
      parameters:
        - in: path
          name: id
          description: Inventory item's unique ID
          required: true
          type: integer
      responses:
        200:
          description: Successfully deleted inventory item
          schema:
            type: object
            properties:
              message:
                type: string
            example:
              message: 'Inventory item id: 1, Oil Filter deleted successfully'
        404:
          description: Item not found
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: 'Inventory item not found'

# ------------------------
definitions:
  # ------------------------
  # Customer Definitions
  # ------------------------
  LoginCredentials:
    type: object
    properties:
      email:
        type: string
      password:
        type: string
    required: [email, password]

  LoginResponse:
    type: object
    properties:
      status:
        type: string
      message:
        type: string
      auth_token:
        type: string

  CreateCustomerPayload:
    type: object
    properties:
      name:
        type: string
      email:
        type: string
      phone:
        type: string
        description: Must be a valid 10-digit US phone number
      password:
        type: string
    required: [name, email, phone, password]

  CreateCustomerResponse:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      email:
        type: string
      phone:
        type: string
      password:
        type: string

  AllCustomers:
    type: array
    items:
      $ref: '#/definitions/CreateCustomerResponse'

  UpdateCustomerPayload:
    type: object
    properties:
      name:
        type: string
      email:
        type: string
      phone:
        type: string
        description: Must be a valid 10-digit US phone number
      password:
        type: string
    required: [name, email, phone, password]

  UpdateCustomerResponse:
    $ref: '#/definitions/CreateCustomerResponse'

  DeleteCustomerResponse:
    type: object
    properties:
      message:
        type: string

  # ------------------------
  # Vehicle Definitions
  # ------------------------
  CreateVehiclePayload:
    type: object
    properties:
      VIN:
        type: string
      make:
        type: string
      model:
        type: string
      year:
        type: integer
